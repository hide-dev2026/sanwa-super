<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 - Push通知送信</title>
</head>
<body>
  <h1>お客様へPush通知</h1>

  <div class="form-row">
    <label>タイトル</label>
    <input id="title" type="text">
  </div>

  <div class="form-row">
    <label>本文</label>
    <input id="body"type="text">
  </div>

  <button onclick="send()">送信</button>

  <p id="result"></p>

  <script>
    // ★ 通知送信サーバーの URL をここに設定
    const PUSH_SEND_URL = "https://sanwa-push-server.onrender.com/send";

    async function send() {
      const resultEl = document.getElementById("result");
      resultEl.innerText = "送信中...";

      try {
        const title = document.getElementById("title").value;
        const body = document.getElementById("body").value;

        if (!title || !body) {
          resultEl.innerText = "エラー：タイトルと本文を入力してください";
          resultEl.style.color = "red";
          return;
        }

        const response = await fetch(PUSH_SEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: title,
            body: body
          })
        });

        const result = await response.json();
        console.log("通知送信サーバー応答:", result);

        if (response.ok && result.success) {
          resultEl.innerText = `✓ 送信完了`;
          resultEl.style.color = "green";
          document.getElementById("title").value = "";
          document.getElementById("body").value = "";
        } else {
          resultEl.innerText = "エラー：" + (result.message || response.statusText);
          resultEl.style.color = "red";
        }

      } catch (error) {
        console.error("送信エラー:", error);
        resultEl.innerText = `エラー: ${error.message}`;
        resultEl.style.color = "red";
      }
    }

    window.send = send;
  </script>
</body>
</html>
