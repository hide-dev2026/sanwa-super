<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 - Push通知送信</title>
</head>
<body>
  <h1>Push通知送信</h1>

  <label>タイトル：</label>
  <input id="title" type="text"><br><br>

  <label>本文：</label>
  <input id="body" type="text"><br><br>

  <button onclick="send()">送信</button>

  <p id="result"></p>

  <!-- Firebase SDK -->
  <script type="module">
    // Firebase SDK 読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

    // ★ あなたの Firebase 設定（app.js と同じ）
    const firebaseConfig = {
      apiKey: "AIzaSyBywl9QQ14GJ9zr3AljSF5IN9nIumj5aMk",
      authDomain: "sanwa-super.firebaseapp.com",
      projectId: "sanwa-super",
      storageBucket: "sanwa-super.firebasestorage.app",
      messagingSenderId: "826299375113",
      appId: "1:826299375113:web:8fd733d62dcc1def4ba2d8",
      measurementId: "G-HFYX2R00SF"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const functions = getFunctions(app);

    // ★ 通知送信処理
    async function send() {
      const resultEl = document.getElementById("result");
      resultEl.innerText = "送信中...";
      
      try {
        const title = document.getElementById("title").value;
        const body = document.getElementById("body").value;

        if (!title || !body) {
          resultEl.innerText = "エラー：タイトルと本文を入力してください";
          resultEl.style.color = "red";
          return;
        }

        // Firestore からトークン取得
        const tokenDoc = await getDoc(doc(db, "tokens", "user1"));
        if (!tokenDoc.exists()) {
          resultEl.innerText = "エラー：トークンが見つかりません（スマホで通知設定ボタンを押してください）";
          resultEl.style.color = "red";
          console.error("トークンが見つかりません");
          return;
        }

        const token = tokenDoc.data().token;
        console.log("取得したトークン:", token);

        // Firebase Functions の呼び出し
        const sendNotification = httpsCallable(functions, "sendNotification");
        const response = await sendNotification({ token, title, body });

        console.log("送信成功:", response);
        resultEl.innerText = "✓ 送信しました";
        resultEl.style.color = "green";
      } catch (error) {
        console.error("送信エラー:", error);
        resultEl.innerText = `エラー: ${error.message}`;
        resultEl.style.color = "red";
      }
    }

    // グローバルに公開（button onclick 用）
    window.send = send;
  </script>
</body>
</html>
