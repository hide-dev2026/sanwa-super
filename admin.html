<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 - Push通知送信</title>
</head>
<body>
  <h1>Push通知送信</h1>

  <label>タイトル：</label>
  <input id="title" type="text"><br><br>

  <label>本文：</label>
  <input id="body" type="text"><br><br>

  <button onclick="send()">送信</button>

  <p id="result"></p>

  <!-- Firebase SDK -->
  <script type="module">
    // Firebase SDK 読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

    // ★ あなたの Firebase 設定（app.js と同じ）
    const firebaseConfig = {
      apiKey: "AIzaSyBywl9QQ14GJ9zr3AljSF5IN9nIumj5aMk",
      authDomain: "sanwa-super.firebaseapp.com",
      projectId: "sanwa-super",
      storageBucket: "sanwa-super.firebasestorage.app",
      messagingSenderId: "826299375113",
      appId: "1:826299375113:web:8fd733d62dcc1def4ba2d8",
      measurementId: "G-HFYX2R00SF"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const functions = getFunctions(app);

    // ★ 通知送信処理
    async function send() {
      const title = document.getElementById("title").value;
      const body = document.getElementById("body").value;

      // Firestore からトークン取得
      const tokenDoc = await getDoc(doc(db, "tokens", "user1"));
      if (!tokenDoc.exists()) {
        document.getElementById("result").innerText = "トークンが見つかりません";
        return;
      }

      const token = tokenDoc.data().token;

      // Firebase Functions の呼び出し
      const sendNotification = httpsCallable(functions, "sendNotification");
      await sendNotification({ token, title, body });

      document.getElementById("result").innerText = "送信しました";
    }

    // グローバルに公開（button onclick 用）
    window.send = send;
  </script>
</body>
</html>
