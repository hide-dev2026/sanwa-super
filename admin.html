<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 - Push通知送信</title>
</head>
<body>
  <h1>Push通知送信</h1>

  <label>タイトルだよ：</label>
  <input id="title" type="text"><br><br>

  <label>本文：</label>
  <input id="body" type="text"><br><br>

  <button onclick="send()">送信</button>

  <p id="result"></p>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyBywl9QQ14GJ9zr3AljSF5IN9nIumj5aMk",
      authDomain: "sanwa-super.firebaseapp.com",
      projectId: "sanwa-super",
      storageBucket: "sanwa-super.firebasestorage.app",
      messagingSenderId: "826299375113",
      appId: "1:826299375113:web:8fd733d62dcc1def4ba2d8",
      measurementId: "G-HFYX2R00SF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ★ Cloudflare Workers の URL をここに入れる
    const WORKER_URL = "https://sanwa-super-push.winwin-hide.workers.dev";

    async function send() {
      const resultEl = document.getElementById("result");
      resultEl.innerText = "送信中...";

      try {
        const title = document.getElementById("title").value;
        const body = document.getElementById("body").value;

        if (!title || !body) {
          resultEl.innerText = "エラー：タイトルと本文を入力してください";
          resultEl.style.color = "red";
          return;
        }

        // Firestore からトークン取得
        const tokenDoc = await getDoc(doc(db, "tokens", "user1"));
        if (!tokenDoc.exists()) {
          resultEl.innerText = "エラー：トークンが見つかりません（スマホで通知設定ボタンを押してください）";
          resultEl.style.color = "red";
          return;
        }

        const token = tokenDoc.data().token;
        console.log("取得したトークン:", token);

        // ★ Cloudflare Workers に送信
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: title,
            body: body,
            tokens: [token]   // ← 配列で送る
          })
        });

        const text = await response.text();
        console.log("Workers の応答:", text);

        if (response.ok) {
          resultEl.innerText = "✓ 送信しました";
          resultEl.style.color = "green";
        } else {
          resultEl.innerText = "エラー：" + text;
          resultEl.style.color = "red";
        }

      } catch (error) {
        console.error("送信エラー:", error);
        resultEl.innerText = `エラー: ${error.message}`;
        resultEl.style.color = "red";
      }
    }

    window.send = send;
  </script>
</body>
</html>
